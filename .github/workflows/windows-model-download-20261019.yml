name: Windows 1.0.2 Complete Portable Build

on:
  push:
    branches:
      - fix/windows-model-download-recovery-20261019
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: microsoft/setup-msbuild@v2
      - name: Run Windows Worker Regression Tests
        shell: pwsh
        run: python -m unittest discover -s windows/tests -p 'test*.py' -v
      - name: Build self-contained Windows WinUI app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = 'windows/src/SPPAudioStudio.Windows/SPPAudioStudio.Windows.csproj'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'winui-recovery-preview'
          & msbuild $project /nologo /m /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:PublishTrimmed=false /p:PublishSingleFile=false /p:DebugType=embedded /p:DebugSymbols=false "/p:PublishDir=$dest\"
          if ($LASTEXITCODE -ne 0) { throw "WinUI preview MSBuild failed: $LASTEXITCODE" }
          $exe = Join-Path $dest 'SPPAudioStudio.Windows.exe'
          $xaml = Join-Path $dest 'Microsoft.UI.Xaml.dll'
          if (-not (Test-Path $exe -PathType Leaf)) { throw "Build output missing exe: $exe" }
          if (-not (Test-Path $xaml -PathType Leaf)) { throw "Build output missing XAML runtime: $xaml" }
      - name: Freeze Windows Python Worker
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input -r windows/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller dependency install failed" }
          python -m PyInstaller --noconfirm --clean --onedir --name SPPWorker --distpath frozen-worker --workpath frozen-work --specpath frozen-work windows/worker/spp_worker.py
          if ($LASTEXITCODE -ne 0) { throw "Python worker freeze failed" }
      - name: Assemble complete portable release
        shell: pwsh
        run: ./windows/ci/assemble-recovery.ps1 -WinUiDirectory "$env:GITHUB_WORKSPACE/winui-recovery-preview" -FrozenWorkerDirectory "$env:GITHUB_WORKSPACE/frozen-worker/SPPWorker" -OutputDirectory "$env:GITHUB_WORKSPACE/windows-release"
      - name: Publish Windows ZIP into existing v1.0.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.0.2 --repo ndsmansyj/SPP-Audio-Studio
          if ($LASTEXITCODE -ne 0) { throw "Existing v1.0.2 release not found" }
          gh release upload v1.0.2 windows-release/SPPAudioStudio-1.0.2-win-x64.zip windows-release/SPPAudioStudio-1.0.2-win-x64.zip.sha256 --repo ndsmansyj/SPP-Audio-Studio --clobber
          if ($LASTEXITCODE -ne 0) { throw "Windows v1.0.2 release upload failed" }
      - name: Upload complete Windows 1.0.2 package
        uses: actions/upload-artifact@v4
        with:
          name: SPP-Audio-Studio-Windows-1.0.2-complete
          path: |
            windows-release/SPPAudioStudio-1.0.2-win-x64.zip
            windows-release/SPPAudioStudio-1.0.2-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
