name: Cloud CI

on:
  push:
    branches:
      - test/chatgpt-actions-smoke-20260924
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quick-check:
    name: Quick checks (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python syntax check
        run: python -m compileall -q worker windows/worker
      - name: Repository sanity
        run: |
          test -f app/SPPAudioStudio.swift
          test -f windows/SPPAudioStudio.Windows.sln
          test -f windows/build.ps1
          test -f scripts/build_local.sh

  macos-compile:
    name: macOS ARM compile check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          uname -a
          swiftc --version
      - name: Compile macOS app
        run: |
          mkdir -p build-ci
          swiftc -swift-version 5 -parse-as-library -target arm64-apple-macos14.0 app/SPPAudioStudio.swift \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework UniformTypeIdentifiers \
            -o build-ci/SPPAudioStudio
          swiftc -O -target arm64-apple-macos14.0 format_converter/main.swift \
            -framework AppKit -framework UniformTypeIdentifiers \
            -o build-ci/format_converter
          file build-ci/SPPAudioStudio build-ci/format_converter

  windows-package:
    name: Windows x64 build + package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: windows/requirements-build.txt
      - name: Validate packaging scripts
        shell: pwsh
        run: python -m unittest windows.tests.test_packaging -v
      - name: Bootstrap build environment
        shell: pwsh
        run: ./windows/bootstrap.ps1
      - name: Build and test
        shell: pwsh
        run: ./windows/build.ps1 -Configuration Release -Platform x64
      - name: Publish portable package
        shell: pwsh
        run: ./windows/publish.ps1 -Platform x64 -Version "0.0.${{ github.run_number }}"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: spp-audio-studio-win-x64
          path: |
            windows/artifacts/packages/*.zip
            windows/artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 7
