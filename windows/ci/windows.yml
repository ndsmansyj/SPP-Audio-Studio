name: Windows portable build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
  push:
    branches: [main]
    paths:
      - "windows/**"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: windows/requirements-build.txt

      - name: Validate packaging scripts
        shell: pwsh
        run: python -m unittest windows.tests.test_packaging -v

      - name: Bootstrap Python environment
        shell: pwsh
        run: ./windows/bootstrap.ps1

      - name: Build and test
        shell: pwsh
        run: ./windows/build.ps1 -Configuration Release -Platform ${{ matrix.platform }}

      - name: Publish portable release
        shell: pwsh
        run: ./windows/publish.ps1 -Platform ${{ matrix.platform }} -Version "0.0.${{ github.run_number }}"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: spp-audio-studio-win-${{ matrix.platform }}
          path: |
            windows/artifacts/packages/*.zip
            windows/artifacts/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
